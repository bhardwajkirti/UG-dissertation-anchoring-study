<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<!-- Browsers hold on to a page they have already seen, which is why replacing the file
     on the host did not change what anyone saw. These tell a browser to ask the server
     every time instead of trusting the copy it kept. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Study of Workplace Experiences and Career Perceptions</title>
<style>
  /* One light palette, deliberately not responsive to the device's dark mode. A phone
     set to dark would otherwise render this dark whatever the colours say, which is the
     opposite of what is wanted for someone filling it in outdoors. Every text-on-fill
     pair below was checked: body text sits at 14:1 or better, muted text and all
     coloured text at 4.9:1 or better. */
  /* ===================== THEME =====================
     Everything to do with how this looks is a variable in this one block, so the whole
     appearance can be changed from here without touching a single rule below. The theme
     editor writes exactly this block. */
  :root{
    /* ---- colours: Lily Pond ---- */
    --bg:#FAF7E0;          /* beige page */
    --surface:#FFFFFF;     /* cards and option rows */
    --fg:#0A2E22;          /* dark green, all body text */
    --muted:#4A6054;
    --line:#CBD4C6;
    --blue:#0F4E5D;        /* primary, midnight green */
    --blue-dark:#093843;
    --powder:#DDEBEC;      /* soft fill */
    --powder-line:#9CC2C7;
    --green:#235E40;
    --green-soft:#E3EEDC;
    --butter:#F5F0C4;      /* soft accent fill */
    --lemon:#B8C06B;       /* bright accent, used sparingly */
    --amber-line:#CBD189;
    --warn:#9A3A2E;
    --stripe:#FBFDFA;      /* every other grid row */
    --unans:#F6EAE6;       /* a grid row left unanswered */

    /* ---- type sizes, laptop ---- */
    --fs-base:16px;        /* body text and option labels */
    --fs-bar:15px;         /* the study title in the top bar */
    --fs-h2:27px;          /* screen heading */
    --fs-lede:16px;        /* the line under a heading */
    --fs-stem:17px;        /* question text */
    --fs-hint:15px;        /* the small grey line under a question */
    --fs-fieldlabel:15px;  /* Years, Months, Lower figure, Upper figure */
    --fs-scaleintro:18px;  /* the instruction above a published scale */
    --fs-pay:20px;         /* the compensation range on the listing */
    --fs-note:15px;        /* the small line under the compensation range */
    --listing-gap:64px;    /* space under the job listing, before the questions */
    --fs-brief:22px;       /* the instruction box above the job listing */
    --fs-callout:18px;     /* the nine-month reminder box */
    --fs-listing:21px;     /* job title inside the listing */
    --fs-gridhead:12.5px;  /* column headings on a scale */
    --fs-griditem:16px;    /* statements on a scale */
    --fs-cap:15px;         /* the words at each end of a linear scale */

    /* ---- type sizes, phone: used below 620px ---- */
    --m-fs-base:15px; --m-fs-h2:22px; --m-fs-stem:16px; --m-fs-brief:18px;
    --m-fs-griditem:15px; --m-fs-gridlab:15px; --m-fs-cap:13px;
    --m-fs-scaleintro:15px;
    --m-lin-gap:14px;      /* slider on a phone: word to circles */
    --m-lin-dot-gap:12px;  /* slider on a phone: between circles */
    --m-dot-size:18px;     /* slider on a phone: circle size */

    /* ---- shape and spacing ---- */
    --prog-h:10px;         /* thickness of the progress bar */
    --lin-gap:38px;        /* slider: gap between an end word and the circles */
    --lin-dot-gap:26px;    /* slider: gap between the circles */
    --radius:12px;         /* corner rounding everywhere */
    --opt-pad-y:12px;      /* height of an option row */
    --opt-pad-x:14px;
    --q-gap:30px;          /* space between questions */
    --maxw:720px;          /* how wide the form column is */
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:var(--fs-base)/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}

  /* Fixed, not sticky, with a spacer below it that never changes height. A sticky bar
     sits in the flow, so shrinking it pulled the page up, which fired another scroll
     event, which put the title back: the header flickered all the way down. Out of the
     flow, it can change size as much as it likes and the page underneath does not move. */
  .bar{position:fixed;top:0;left:0;right:0;background:var(--surface);
    border-bottom:1px solid var(--line);z-index:20}
  #barpad{height:var(--barPad,71px)}
  .bar .inner{max-width:var(--maxw);margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
  .bar h1{font-size:var(--fs-bar);margin:0;font-weight:600;flex:1;color:var(--fg)}
  /* Once somebody has scrolled into a screen the title is dropped and only the progress
     bar stays, so nothing competes for attention while they are answering. The job
     listing screen keeps its title, because that is the one place a participant might
     otherwise wonder whether the page has sent them somewhere else. */
  .bar.compact h1{display:none}
  .bar.compact .prog{flex:1 1 auto}
  .prog{height:var(--prog-h);background:var(--powder);border-radius:99px;overflow:hidden;flex:0 0 150px}
  .prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}

  main{max-width:var(--maxw);margin:0 auto;padding:26px 16px 28px}
  h2{font-size:var(--fs-h2);margin:0 0 10px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
  /* 10px of clearance, otherwise this sits on the tail of a descender: the bar under
     "The job market" touched the j. */
  h2 .accent{display:block;width:46px;height:5px;background:var(--lemon);border-radius:99px;margin:10px 0 14px}
  .lede{color:var(--muted);margin:0 0 20px;font-size:var(--fs-lede)}
  /* A scale instruction has to be read rather than skimmed, so it sits larger, darker
     and a notch heavier than the prose around it. */
  .lede.scale-intro{color:var(--fg);font-weight:500;font-size:var(--fs-scaleintro)}
  p{margin:0 0 14px}
  ul.elig{margin:0 0 14px;padding-left:20px}
  ul.elig li{margin:3px 0}
  .q{margin:0 0 var(--q-gap);padding:0}
  .q>label.stem,.stem{display:block;font-weight:600;margin:0 0 12px;font-size:var(--fs-stem);line-height:1.45}
  .hint{display:block;color:var(--muted);font-weight:400;font-size:var(--fs-hint);margin-top:5px}

  /* Blue block: used to stop the eye and hold it on the job listing instruction. */
  .brief{border:2px solid var(--powder-line);background:var(--powder);border-radius:var(--radius);
    padding:24px 26px;margin:0 0 24px;font-size:var(--fs-brief);line-height:1.45;font-weight:700}
  .brief p{margin:0 0 8px}.brief p:last-child{margin:0}
  /* Yellow block: used once, for the nine-month frame on the last scale. */
  .callout{border:2px solid var(--amber-line);background:var(--butter);border-radius:var(--radius);
    padding:13px 16px;margin:0 0 22px;font-size:var(--fs-callout);font-weight:700;text-align:center;letter-spacing:.02em}

  .opts{display:flex;flex-direction:column;gap:7px}
  .opt{display:flex;align-items:flex-start;gap:11px;padding:var(--opt-pad-y) var(--opt-pad-x);border:1.5px solid var(--line);
    border-radius:var(--radius);cursor:pointer;background:var(--surface);transition:background .12s,border-color .12s}
  .opt:hover{border-color:var(--powder-line);background:var(--powder)}
  .opt:has(input:checked){border-color:var(--blue);background:var(--powder)}
  .opt input{margin:3px 0 0;flex:0 0 auto;accent-color:var(--blue);width:18px;height:18px}
  .opt span{flex:1}
  .opt .spec{margin-top:9px}

  input[type=text],input[type=number],input[type=email]{width:100%;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit}
  input::placeholder{color:#8A96A3}
  input:focus{outline:3px solid var(--powder-line);outline-offset:0;border-color:var(--blue)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1 1 150px}
  .row label{display:block;font-size:var(--fs-fieldlabel);color:var(--muted);margin-bottom:5px}
  /* Held to half width on a laptop by an empty second column before, which squeezed the
     field on a phone until the word Amount was cut off. Capped directly instead, and the
     cap is lifted on a phone where the whole width is wanted. */
  .row.capped>div{max-width:340px}
  .rupee{display:flex;align-items:center;gap:9px}
  .rupee .sym{font-weight:700;font-size:17px}
  .rupee .suf{color:var(--muted);font-size:var(--fs-stem)}

  .ac{position:relative}
  /* overflow is hidden, not auto. A suggestion list that scrolls its own contents will
     swallow a touch drag, and because the page never scrolls it looks like the form has
     frozen. The number of suggestions is capped instead, so the list always fits. */
  .ac ul{position:absolute;left:0;right:0;top:calc(100% + 4px);margin:0;padding:5px;list-style:none;
    background:var(--surface);border:1.5px solid var(--powder-line);border-radius:var(--radius);
    overflow:hidden;z-index:30;box-shadow:0 10px 26px rgba(20,40,60,.14)}
  .ac ul.up{top:auto;bottom:calc(100% + 4px)}
  .ac li{padding:9px 11px;border-radius:8px;cursor:pointer}
  .ac li:hover,.ac li[aria-selected=true]{background:var(--powder)}
  .ac li.head{cursor:default;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);padding:6px 11px 4px;font-weight:700}
  .ac li.head:hover{background:transparent}
  .ac li.mine{font-weight:600}

  /* No overflow:hidden here. It would silently disable the sticky header below. */
  .grid{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface)}
  .grid .hd{display:grid;grid-template-columns:1fr repeat(5,76px);padding:11px 12px;
    border-bottom:1.5px solid var(--line);font-size:var(--fs-gridhead);line-height:1.25;color:var(--fg);
    text-align:center;background:var(--powder);position:sticky;top:var(--barH,52px);z-index:5;
    border-radius:10px 10px 0 0;font-weight:700}
  .grid .hd span:first-child{text-align:left}
  .grid .rw{display:grid;grid-template-columns:1fr repeat(5,76px);align-items:center;
    padding:13px 12px;border-bottom:1px solid var(--line)}
  .grid .rw:last-child{border-bottom:0}
  .grid .rw:nth-child(even){background:var(--stripe)}
  .grid .rw .txt{padding-right:12px;font-size:var(--fs-griditem);line-height:1.45}
  .grid .rw label{display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:40px}
  .grid .rw input{accent-color:var(--blue);width:20px;height:20px}
  .grid .rw.unanswered{background:var(--unans)}

  /* Linear scale, as the original instrument prints it: words at the two ends only. */
  /* The three columns are a fixed width rather than sized to their contents. Sized to
     contents, a long end label such as "Totally dissatisfying" squeezes the middle and
     the circles land somewhere different on every question. Fixed, they sit in exactly
     the same place down the whole scale. The circles themselves are an equal-fraction
     grid, so the gaps between them are identical by construction. */
  /* Named .cap, not .end: the closing screen already owns .end and gives it 40px of
     vertical padding, which this used to inherit.
     The circles sit as one centred cluster with a fixed gap, and the two end words are
     pushed in towards them. The side columns are equal, so the cluster lands in the same
     place on every question however long the words at the ends are. */
  .lin{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);
    padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--lin-gap)}
  .lin .cap{font-size:var(--fs-cap);font-weight:600;color:var(--fg);line-height:1.3;text-align:right}
  .lin .cap.r{text-align:left}
  .lin .dots{display:flex;gap:var(--lin-dot-gap);align-items:center}
  .lin .dots label{display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:44px}
  .lin .dots input{accent-color:var(--blue);width:24px;height:24px;margin:0}

  .listing{border:2px solid var(--fg);border-radius:var(--radius);padding:22px;margin:10px 0 var(--listing-gap);
    background:var(--surface)}
  .listing .ttl{font-weight:700;font-size:var(--fs-listing);margin:0 0 12px;text-transform:capitalize}
  .listing .ln{margin:4px 0}
  .listing .pay{margin-top:14px;font-weight:700;background:var(--butter);display:inline-block;
    padding:9px 15px;border-radius:9px;font-size:var(--fs-pay);line-height:1.35}
  .listing .pay .v{white-space:nowrap}
  .listing .note{font-size:var(--fs-note);color:var(--muted);margin-top:11px;font-weight:600}

  /* Deliberately not fixed. A Continue button floating over the page invites a tap
     before anything has been read; at the foot of the content it can only be reached by
     scrolling past every question. */
  .nav{background:var(--surface);border-top:1px solid var(--line);padding:16px}
  .nav .inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:11px;justify-content:space-between}
  button{font:inherit;font-weight:600;padding:12px 22px;border-radius:var(--radius);
    border:1.5px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
  button:hover:not(:disabled){background:var(--blue-dark);border-color:var(--blue-dark)}
  button.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
  button.ghost:hover{background:var(--powder);border-color:var(--powder-line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .err{color:var(--warn);font-size:14px;margin-top:9px;display:none;font-weight:600}
  .err.on{display:block}

  .end{text-align:center;padding:40px 8px}
  .end h2{font-size:23px}
  /* The ask to pass it on, on the closing screen. Somebody who has just finished is
     already on their phone and already knows what they would be forwarding, which is
     why this sits here rather than in a reminder nobody can send. */
  .share{background:var(--powder);border:1.5px solid var(--powder-line);border-radius:var(--radius);
    padding:19px 16px 18px;margin:0 0 26px}
  .share p{margin:0 0 14px;font-size:var(--fs-callout);font-weight:700}
  .share a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;
    font-weight:600;padding:12px 26px;border-radius:11px;font-size:15.5px}
  .share a:hover{background:var(--blue-dark)}

  @media (max-width:620px){
    /* The phone sizes live in their own variables, so a laptop change never drags the
       phone along with it and the two can be tuned apart. */
    :root{ --fs-base:var(--m-fs-base); --fs-h2:var(--m-fs-h2); --fs-stem:var(--m-fs-stem);
           --fs-brief:var(--m-fs-brief); --fs-griditem:var(--m-fs-griditem);
           --fs-cap:var(--m-fs-cap); --fs-scaleintro:var(--m-fs-scaleintro); }
    .lede.scale-intro{line-height:1.45}

    /* Numbered on a phone, where each statement stands alone as its own question and
       there is no column of rows to show how far along you are. */
    .grid{counter-reset:stmt}
    .grid .rw{counter-increment:stmt}
    .grid .rw .txt::before{content:counter(stmt) ". "}

    /* Minimum and Maximum take a line each rather than splitting one, which left too
       little room beside the rupee sign and the word lakhs to show the whole word. */
    .row:has(.rupee)>div{flex:1 1 100%}
    .listing{margin-bottom:calc(var(--listing-gap) * .62)}
    .brief{padding:19px 18px}

    /* A five column matrix cannot work on a phone, so each statement becomes a question
       of its own: its own heading, and five answer rows shaped exactly like the options
       on every other screen. The surrounding box is dropped, otherwise the whole scale
       reads as one enormous card. */
    .grid{border:0;background:transparent;border-radius:0}
    .grid .hd{display:none}
    .grid .rw{display:block;padding:0;border:0;margin:0 0 var(--q-gap)}
    .grid .rw:last-child{margin-bottom:0}
    .grid .rw:nth-child(even){background:transparent}
    .grid .rw.unanswered{background:transparent}
    .grid .rw.unanswered .txt{color:var(--warn)}
    .grid .rw .txt{padding:0 0 10px;font-weight:600;font-size:var(--m-fs-stem);line-height:1.45}
    .grid .rw label{display:flex;align-items:center;justify-content:flex-start;gap:11px;
      min-height:0;margin:0 0 7px;padding:var(--opt-pad-y) var(--opt-pad-x);
      border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface)}
    .grid .rw label:last-child{margin-bottom:0}
    .grid .rw label:has(input:checked){border-color:var(--blue);background:var(--powder)}
    .grid .rw label::after{content:attr(data-lab);font-size:var(--m-fs-gridlab);font-weight:400}
    .grid .rw label input{flex:0 0 auto;width:18px;height:18px}

    /* The slider keeps the shape it has on a laptop, a word at each side of the circles,
       scaled down rather than stacked. Stacking put one word above the circles and the
       other below, which read as though the words were answers. */
    .lin{padding:13px 10px;gap:var(--m-lin-gap)}
    .lin .dots{gap:var(--m-lin-dot-gap)}
    .lin .dots input{width:var(--m-dot-size);height:var(--m-dot-size)}
    .lin .dots label{min-height:38px}

    /* The range breaks after the label instead of wherever the words happen to run out. */
    .listing .pay{display:block}
    .listing .pay .k{display:block}
  }
</style>
</head>
<body>
<div class="bar"><div class="inner"><h1 id="barTitle">Study of Workplace Experiences and Career Perceptions</h1>
<div class="prog"><i id="prog"></i></div></div></div>
<div id="barpad"></div>
<main id="main"></main>
<div class="nav"><div class="inner">
  <button class="ghost" id="back" type="button">Back</button>
  <button id="next" type="button">Continue</button>
</div></div>

function linear(name, leftLabel, rightLabel){
  let dots = "";
  for(let i=1;i<=5;i++){
    const where = i === 1 ? leftLabel : (i === 5 ? rightLabel : "");
    const lab = where ? `${where}, point ${i} of 5` : `Point ${i} of 5`;
    dots += `<label><input type="radio" name="${name}" value="${i}" aria-label="${esc(lab)}"></label>`;
  }
  return `<div class="lin"><div class="cap">${esc(leftLabel)}</div>` +
    `<div class="dots">${dots}</div>` +
    `<div class="cap r">${esc(rightLabel)}</div></div>`;
}

/* The list is headed "Auto suggestions" and the participant's own typing sits at the
   top as a selectable option, so the list reads as suggestions and not as a menu they
   are confined to. It flips above the field when there is no room below it. */
function autocomplete(id, list, showMine){
  const inp = document.getElementById(id);
  if(!inp) return;
  const wrap = inp.parentElement; let ul = null, idx = -1, justPicked = false;
  const close = () => { if(ul){ ul.remove(); ul = null; idx = -1; } };
  /* Setting the value fires another input event, which would reopen the list straight
     after a selection. This flag swallows exactly that one event. */
  /* Setting .value in script does not raise an input event, so the form never learned
     that "Pu" had become "Pune". Going Back then restored the half-typed text and the
     job listing was built from it. The event is raised by hand; justPicked swallows the
     reopen it would otherwise trigger. */
  const pick = v => {
    justPicked = true;
    inp.value = v;
    inp.dispatchEvent(new Event("input", { bubbles:true }));
    close(); inp.blur();
  };
  const open = () => {
    if(justPicked){ justPicked = false; return; }
    const q = inp.value.trim(); close();
    if(q.length < 2) return;
    const ql = q.toLowerCase();
    const starts = [], has = [];
    for(const x of list){
      const xl = x.toLowerCase();
      if(xl.startsWith(ql)) starts.push(x);
      else if(xl.includes(ql)) has.push(x);
    }
    starts.sort((a,b) => a.length - b.length);
    has.sort((a,b) => a.length - b.length);
    /* The list never scrolls its own contents, so it has to be short enough to fit in
       whatever space there is. With a keyboard up that space is small and above the
       field, so the row count is worked out from the room actually available rather
       than fixed. */
    const vv0 = window.visualViewport;
    const vT = vv0 ? vv0.offsetTop : 0;
    const vB = vT + (vv0 ? vv0.height : window.innerHeight);
    const wr = wrap.getBoundingClientRect();
    const room = Math.max(vB - wr.bottom, wr.top - vT) - 16;
    const ROW = 38, CHROME = 30 + (showMine ? 40 : 0);
    const fits = Math.max(2, Math.floor((room - CHROME) / ROW));
    const hits = starts.concat(has).slice(0, Math.min(window.innerWidth < 620 ? 4 : 7, fits));
    if(!hits.length && !showMine) return;
    ul = document.createElement("ul");
    const head = document.createElement("li");
    head.className = "head"; head.textContent = "Auto suggestions";
    ul.appendChild(head);
    if(showMine){
      const mine = document.createElement("li");
      mine.className = "mine"; mine.textContent = "Keep what I typed: " + q;
      mine.addEventListener("mousedown", e => { e.preventDefault(); justPicked = true; close(); inp.blur(); });
      ul.appendChild(mine);
    }
    hits.forEach(h => { const li = document.createElement("li"); li.textContent = h;
      li.addEventListener("mousedown", e => { e.preventDefault(); pick(h); }); ul.appendChild(li); });
    wrap.appendChild(ul);
    place();
  };

  /* With the keyboard open there is usually no room under the field at all, so the list
     has to sit above it. window.innerHeight does not change when a keyboard appears;
     visualViewport is the only thing that knows, so the decision is made from that. */
  const place = () => {
    if(!ul) return;
    const vv = window.visualViewport;
    const vTop = vv ? vv.offsetTop : 0;
    const vBottom = vTop + (vv ? vv.height : window.innerHeight);
    const r = wrap.getBoundingClientRect();
    const need = ul.offsetHeight + 10;
    const below = vBottom - r.bottom, above = r.top - vTop;
    ul.classList.toggle("up", below < need && above > below);
  };
  if(window.visualViewport) window.visualViewport.addEventListener("resize", place);
  inp.addEventListener("input", open);
  inp.addEventListener("keydown", e => {
    if(!ul) return;
    const lis = [...ul.querySelectorAll("li:not(.head)")];
    if(!lis.length) return;
    if(e.key === "ArrowDown"){ e.preventDefault(); idx = Math.min(idx+1, lis.length-1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); idx = Math.max(idx-1, 0); }
    else if(e.key === "Enter"){ if(idx >= 0){ e.preventDefault();
      if(lis[idx].classList.contains("mine")){ justPicked = true; close(); } else pick(lis[idx].textContent); } return; }
    else if(e.key === "Escape"){ close(); return; } else return;
    lis.forEach((l,i) => l.setAttribute("aria-selected", i === idx));
  });
  inp.addEventListener("blur", () => setTimeout(close, 120));
  const outside = ev => { if(!wrap.contains(ev.target)) close(); };
  document.addEventListener("pointerdown", outside, true);
  document.addEventListener("touchstart", outside, true);
  window.addEventListener("scroll", close, { passive:true });
  document.addEventListener("touchmove", close, { passive:true });
}

/* At the top of a screen the bar carries the study title and the progress bar. Once
   somebody starts scrolling the title goes and the progress bar runs full width, so
   nothing competes for attention while they are answering. The job listing screen keeps
   its title throughout, because that is the one place a participant might wonder whether
   the page has sent them somewhere else.

   Two things stop this flickering. The bar is out of the flow and a spacer of fixed
   height holds its place, so changing it never moves the page. And the thresholds are
   apart rather than equal, so a reading that lands near the boundary cannot flip the
   state back and forth. */
let keepTitle = false;
const HIDE_AT = 60, SHOW_AT = 12;

function measureBar(){
  const bar = document.querySelector(".bar");
  if(!bar) return;
  const was = bar.classList.contains("compact");
  bar.classList.remove("compact");
  const tall = bar.offsetHeight || 71;
  bar.classList.add("compact");
  const short = bar.offsetHeight || 33;
  bar.classList.toggle("compact", was);
  const r = document.documentElement.style;
  r.setProperty("--barPad", tall + "px");   // the spacer, and it never changes again
  r.setProperty("--barH", short + "px");    // what a sticky scale header sits under
}

function setBarState(){
  const bar = document.querySelector(".bar");
  if(!bar) return;
  if(keepTitle){ bar.classList.remove("compact"); return; }
  const y = window.scrollY;
  if(y > HIDE_AT) bar.classList.add("compact");
  else if(y < SHOW_AT) bar.classList.remove("compact");
}
window.addEventListener("scroll", setBarState, { passive:true });
window.addEventListener("resize", () => { measureBar(); setBarState(); });

/* On a phone the on-screen keyboard covers the lower half of the window, and a field
   near the bottom sits behind it while you type. visualViewport reports the part of the
   page that is actually visible, so whenever it opens or changes size the question being
   answered is scrolled into that area. Without this you type blind. */
(function(){
  const vv = window.visualViewport;
  let focused = null;
  const reveal = () => {
    if(!focused || !document.contains(focused)) return;
    const visible = vv ? vv.height : window.innerHeight;
    const block = focused.closest(".q") || focused;
    /* A long question cannot fit above the keyboard, so show the box itself instead. */
    const target = block.getBoundingClientRect().height > visible - 90 ? focused : block;
    const r = target.getBoundingClientRect();
    const headroom = 64, footroom = 14;

    /* Worked out as an absolute position, and jumped to rather than animated. Scrolling
       by a difference measured part way through an earlier smooth scroll adds the two
       together, which is what threw the email field clean off the top of the screen. */
    let y = window.scrollY;
    if(r.bottom > visible - footroom) y += r.bottom - (visible - footroom);
    const topAfter = r.top - (y - window.scrollY);
    if(topAfter < headroom) y -= (headroom - topAfter);
    y = Math.max(0, y);
    if(Math.abs(y - window.scrollY) > 4) window.scrollTo(0, y);
  };
  document.addEventListener("focusin", e => {
    const t = e.target;
    if(!t || !t.matches || !t.matches("input[type=text],input[type=number],input[type=email]")) return;
    focused = t;
    setTimeout(reveal, 330);          // let the keyboard finish opening first
  });
  document.addEventListener("focusout", () => { focused = null; });
  if(vv) vv.addEventListener("resize", () => setTimeout(reveal, 80));
})();

/* A number box under the cursor will otherwise change its own value when the page is
   scrolled, which silently alters an answer and can screen somebody out. Releasing
   focus on the first wheel movement leaves the page scrolling and the number alone. */
document.addEventListener("wheel", e => {
  const el = document.activeElement;
  if(el && el.type === "number" && el === e.target) el.blur();
}, { passive:true });

/* ---------------- mechanics ---------------- */

/* Everything typed or ticked is kept here the moment it changes, and put back when a
   screen is drawn again. Going Back never loses an answer. */
const RAW = {};
document.getElementById("main").addEventListener("input", e => {
  const el = e.target; if(!el.name && !el.id) return;
  if(el.type === "radio"){ if(el.checked) RAW["r:" + el.name] = el.value; }
  else if(el.type === "checkbox"){ RAW["c:" + (el.name || el.id) + ":" + el.value] = el.checked; }
  else RAW["v:" + (el.id || el.name)] = el.value;
}, true);
document.getElementById("main").addEventListener("change", e => {
  const el = e.target;
  if(el.type === "checkbox") RAW["c:" + (el.name || el.id) + ":" + el.value] = el.checked;
  if(el.type === "radio" && el.checked) RAW["r:" + el.name] = el.value;
}, true);
/* Typing in an "Other, please specify" box should select its own option. */
document.getElementById("main").addEventListener("focusin", e => {
  const inp = e.target.closest(".opt .spec"); if(!inp) return;
  const radio = inp.closest(".opt").querySelector('input[type=radio]');
  if(radio && !radio.checked){ radio.checked = true; RAW["r:" + radio.name] = radio.value; }
});

function restore(){
  document.querySelectorAll("#main input").forEach(el => {
    if(el.type === "radio"){ if(RAW["r:" + el.name] === el.value) el.checked = true; }
    else if(el.type === "checkbox"){ const k = "c:" + (el.name || el.id) + ":" + el.value;
      if(RAW[k] !== undefined) el.checked = !!RAW[k]; }
    else { const v = RAW["v:" + (el.id || el.name)]; if(v !== undefined) el.value = v; }
  });
}

function val(name){ const el = document.querySelector(`input[name="${name}"]:checked`); return el ? el.value : null; }
function err(id){ document.querySelectorAll(".err").forEach(e => e.classList.remove("on"));
  const e = $("#" + id); if(e){ e.classList.add("on"); e.scrollIntoView({block:"center",behavior:"smooth"}); } return false; }
function gridValidate(name, n, errId){
  let missing = null;
  for(let i = 1; i <= n; i++){
    const v = val(`${name}_${i}`); const row = document.querySelector(`[data-row="${name}_${i}"]`);
    if(!v){ if(row) row.classList.add("unanswered"); if(missing === null) missing = row; }
    else { if(row) row.classList.remove("unanswered"); S[`${name}${i}`] = +v; }
  }
  if(missing){ const e = $("#" + errId); e.classList.add("on"); missing.scrollIntoView({block:"center",behavior:"smooth"}); return false; }
  return true;
}

/* Asks the server for a participant number and a condition, so the cells stay even
   inside every salary band. Falls back to a local draw only after a retry, so a network
   problem can never stop someone finishing.

   The timeout is deliberately long. Apps Script takes several seconds to wake from cold,
   and a short timeout meant ordinary slowness was treated as failure: those responses got
   a locally drawn condition and an ID like L-k3f9, which sits outside the permuted blocks
   and breaks the sequence. Assignment Method records which path every row took. */
/* Apps Script shuts an instance down between requests and takes several seconds to wake.
   That wait used to land on the participant, at the one moment the form has to stop and
   ask the server for a condition. A throwaway request on load, and another one screen
   earlier, mean the instance is already awake by then. The reply is ignored; waking it
   is the entire point. */
function warmBackend(){
  if(!CFG.ENDPOINT) return;
  try { fetch(CFG.ENDPOINT, { mode:"no-cors", cache:"no-store" }).catch(() => {}); }
  catch(e){}
}

function assign(cb){
  const finish = (cond, pid, blk, how) => {
    S.condition = cond;
    S.pid = pid || ("L-" + S.localId);
    S.block = blk || "";
    S.assignment_method = how;
    buildAnchor(); snapshotPipes(); cb();
  };
  const localCond = () => ["high","low","control"][Math.floor(Math.random()*3)];
  if(!CFG.ENDPOINT){ return finish(localCond(), null, "", "local_no_endpoint"); }

  let done = false;
  const url = CFG.ENDPOINT + (CFG.ENDPOINT.includes("?") ? "&" : "?") +
    "action=assign&band=" + encodeURIComponent(S.band) + "&ref=" + encodeURIComponent(S.localId);

  const attempt = (tries_left, why) => {
    if(done) return;
    if(tries_left <= 0){ done = true; return finish(localCond(), null, "", why); }
    let settled = false;
    const timer = setTimeout(() => {
      if(settled || done) return; settled = true;
      attempt(tries_left - 1, "local_timeout");
    }, 12000);
    fetch(url).then(r => r.json()).then(j => {
      if(settled || done) return; settled = true; clearTimeout(timer);
      if(j && j.ok && j.condition){ done = true; finish(j.condition, j.pid, j.block, "server"); }
      else attempt(tries_left - 1, "local_bad_reply");
    }).catch(() => {
      if(settled || done) return; settled = true; clearTimeout(timer);
      attempt(tries_left - 1, "local_error");
    });
  };
  attempt(2, "local_error");
}

function buildAnchor(){
  const set = D.wide;
  const pair = set[S.band];
  S.anchor_set = "wide";
  S.anchorShown = S.condition === "high" ? pair[1] : (S.condition === "low" ? pair[0] : null);
  if(S.anchorShown){
    const parts = S.anchorShown.split(" to ");
    S.anchorLow = parseFloat(parts[0]);
    S.anchorHigh = parts.length > 1 ? parseFloat(parts[1]) : "";
  } else { S.anchorLow = ""; S.anchorHigh = ""; }

  /* Three ranges, and for anyone who saw one, theirs is always among them. Without
     that, every treated participant would fail the recall check.
     D.decoys holds plausible wrong ranges for this band. It is not an anchor set and is
     never shown on the listing; it exists so the recall check has more than one wrong
     answer to offer. */
  const pool = [D.decoys[S.band][0], D.decoys[S.band][1], D.wide[S.band][0], D.wide[S.band][1]];
  let opts = [];
  if(S.anchorShown) opts.push(S.anchorShown);
  for(const p of shuffle(pool)){ if(opts.length >= 3) break; if(!opts.includes(p)) opts.push(p); }
  S.recallOpts = shuffle(opts.slice(0,3)).map(x => "₹" + x + " LPA")
    .concat(["It stated no compensation range", "I don’t recall"]);
}

/* If the participant goes back and edits anything the job listing is built from, the
   listing they already saw no longer matches their answers. The condition is kept, the
   listing is rebuilt from the new values, and the listing questions are cleared so they
   are answered against what was actually shown. */
function snapshotPipes(){ S.pipeSnapshot = [S.b5, S.b6, S.b7, S.expBandShown, S.b9].join("|"); }
function pipesChanged(){
  return S.pipeSnapshot !== null &&
    S.pipeSnapshot !== [S.b5, S.b6, S.b7, S.expBandShown, S.b9].join("|");
}
function invalidateListing(){
  S.revisedAfterListing = 1;
  for(const k of ["c1","c2","c3","c4"]){ delete S[k]; delete RAW["r:" + k]; }
  S.listingSeconds = 0;
  buildAnchor(); snapshotPipes();
}

function busy(on){
  const b = $("#next");
  b.disabled = on; b.textContent = on ? "Please wait…" : (step === SCREENS.length - 1 ? "Submit" : "Continue");
}

/* A screened-out record is saved under its own id, so if the person says it was a
   misclick and goes back, their real response is not treated as a duplicate. */
function screenOut(msg, reason){
  sendRecord(buildRecord("Screened out", reason));
  paintEnd(msg, false, true);
  return "stop";
}

function derive(){
  const mid = (bandOf(S.band) || {}).mid || "";
  S.band_mid = mid;
  S.reference_gap = (mid && S.poo) ? +(Math.log(S.poo) - Math.log(mid)).toFixed(6) : "";
  const ocg = []; for(let i=1;i<=12;i++) if(typeof S["d"+i] === "number") ocg.push(S["d"+i]);
  S.ocg_mean = ocg.length === 12 ? +(ocg.reduce((a,b)=>a+b,0)/12).toFixed(4) : "";
  const psq = []; for(let i=1;i<=18;i++) if(typeof S["f"+i] === "number") psq.push(S["f"+i]);
  S.psq_mean = psq.length === 18 ? +(psq.reduce((a,b)=>a+b,0)/18).toFixed(4) : "";
  const tis = []; for(let i=1;i<=6;i++) if(typeof S["g"+i] === "number") tis.push(S["g"+i]);
  S.tis_mean = tis.length === 6 ? +(tis.reduce((a,b)=>a+b,0)/6).toFixed(4) : "";
  S.finished = new Date().toISOString();
  S.duration_min = +(((new Date(S.finished) - new Date(S.started)) / 60000)).toFixed(1);
}

/* ---------------- the record written to the sheet ----------------
   Column names match the sheet exactly. Two parallel objects: one holds the words a
   participant chose, one holds the codebook numbers. The backend writes the first to
   Responses and the second to Responses Coded, same row order, same Participant ID. */
const CODE = {
  gender: D.gender, education: D.education.concat(["Other"]),
  workmode: D.workmode, orgsize: D.orgsize.concat(["Other"]),
  status: ["Complete","Screened out","Partial"], anchorSet: ["wide"],
};
function ix(list, v){ const i = list.indexOf(v); return i < 0 ? "" : i + 1; }
function condCode(c){ return c === "control" ? 0 : (c === "high" ? 1 : (c === "low" ? 2 : "")); }
function wordsOf(labels, n){ return (typeof n === "number" && labels[n-1]) ? labels[n-1] : ""; }
const blank = v => (v === undefined || v === null) ? "" : v;

function buildRecord(status, screenReason){
  const w = {}, c = {};
  const put = (name, word, code) => { w[name] = blank(word); c[name] = blank(code); };
  const same = (name, v) => put(name, v, v);

  same("Participant ID", S.pid || ("L-" + S.localId));
  same("Submitted At", new Date().toISOString());
  put("Status", status, ix(CODE.status, status));
  same("Screen Out Reason", screenReason || "");
  same("Recruitment Source", S.src || "");
  same("Assignment Method", S.assignment_method || "");
  same("Minutes Taken", blank(S.duration_min));

  put("Condition", S.condition === "control" ? "Control" :
      (S.condition === "high" ? "High range" : (S.condition === "low" ? "Low range" : "")),
      condCode(S.condition));
  put("Anchor Set", S.anchor_set ? "Wide" : "",
      S.anchor_set ? ix(CODE.anchorSet, S.anchor_set) : "");
  same("Anchor Lower Value", blank(S.anchorLow));
  same("Anchor Higher Value", blank(S.anchorHigh));
  same("Randomisation Block", S.block || "");
  same("Listing Seconds", S.listingSeconds || "");
  const tb = S.listingSeconds ? timeBand(S.listingSeconds) : "";
  put("Listing Time Band", tb, tb ? (D.timeBands.findIndex(x => x[1] === tb) + 1 || D.timeBands.length + 1) : "");
  same("Revised After Listing", S.revisedAfterListing);

  same("Employment Status", S.b1 || "");
  same("Email", S.b1e || "");
  same("Age", blank(S.b2));
  put("Gender", S.b3 || "", S.b3 ? ix(CODE.gender, S.b3) : "");
  same("Tenure Years", blank(S.b4y));
  same("Tenure Months", blank(S.b4m));
  same("Tenure Total Months", blank(S.b4_months));
  same("Job Title As Typed", S.b5_raw || "");
  same("Job Title Cleaned", S.b5 || "");
  same("Picked From Suggestions", blank(S.b5_picked));
  same("NCO Unit Group Code", S.b5_nco || "");
  same("City", S.b6 || "");
  put("Work Arrangement", S.b7 || "", S.b7 ? ix(CODE.workmode, S.b7) : "");
  same("Total Experience Years", blank(S.b8y));
  same("Total Experience Months", blank(S.b8m));
  same("Total Experience Total Months", blank(S.b8_months));
  same("Experience Band Shown", S.expBandShown || "");
  const bd = bandOf(S.b9);
  put("Salary Band", bd ? bd.label : (S.b9 === 9 ? "Above ₹60 lakhs" : ""), S.b9 || "");
  same("Salary Band Midpoint", blank(S.band_mid));
  put("Education", S.b10 || "", S.b10 ? ix(CODE.education, S.b10) : "");
  same("Education Other", S.b10other || "");
  same("Sector As Written By Participant", S.b11 || "");
  same("NIC Division Code Final", "");
  same("NIC Division Name", "");
  same("NIC Section Code", "");
  put("Organisation Size", S.b12 || "", S.b12 ? ix(CODE.orgsize, S.b12) : "");
  same("Organisation Size Other", S.b12other || "");

  const eL = D.engage.map(e => e[1]).concat([D.engagePay[1]]);
  put("Listing Q1 Appeal", wordsOf(eL[0], S.c1), blank(S.c1));
  put("Listing Q2 Apply", wordsOf(eL[1], S.c2), blank(S.c2));
  put("Listing Q3 Realistic", wordsOf(eL[2], S.c3), blank(S.c3));
  put("Listing Q4 Pay Versus Expectation", wordsOf(eL[3], S.c4), (typeof S.c4 === "number") ? S.c4 : "");

  same("Outside Option Lowest", blank(S.e_low));
  same("Outside Option Highest", blank(S.e_high));
  same("Outside Option Midpoint", blank(S.poo));
  same("Outside Option Width", blank(S.poo_width));
  same("Reference Gap", blank(S.reference_gap));

  for(let i=1;i<=12;i++) put("OCG Item " + i, wordsOf(D.ocgL, S["d"+i]), blank(S["d"+i]));
  same("OCG Mean", blank(S.ocg_mean));
  for(let i=1;i<=18;i++) put("PSQ Item " + i, wordsOf(D.psqL, S["f"+i]), blank(S["f"+i]));
  same("PSQ Mean", blank(S.psq_mean));
  /* Scale 3 has no word labels between its ends, so the words tab records the number
     with the two endpoint words beside it, which is what a reader needs to interpret it. */
  for(let i=1;i<=6;i++){
    const n = S["g"+i];
    put("TIS Item " + i,
        (typeof n === "number") ? (n + " (1 = " + D.tis[i-1][1] + ", 5 = " + D.tis[i-1][2] + ")") : "",
        blank(n));
  }
  same("TIS Mean", blank(S.tis_mean));

  same("CTC Exact", blank(S.h1_exact_ctc));
  same("CTC Declined", blank(S.h1_declined));
  same("Recall Answer", S.h2_recall || "");
  same("Recall Correct", blank(S.recall_correct));

  return { ref: S.localId, pid: w["Participant ID"], row: w, coded: c };
}

/* Saves the response, confirms it was received, and retries if it was not.
   The answers are also kept in this browser, so nothing is lost while retrying. */
function sendRecord(rec, onDone){
  const payload = JSON.stringify(rec);
  try { localStorage.setItem("sa_pending_" + rec.pid, payload); } catch(e){}
  if(!CFG.ENDPOINT){ console.log("No endpoint set. Response:", rec); if(onDone) onDone(true); return; }
  let attempt = 0;
  const tryOnce = () => {
    attempt++;
    fetch(CFG.ENDPOINT, { method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body: payload })
      .then(r => r.json())
      .then(j => {
        if(j && j.ok){
          try { localStorage.removeItem("sa_pending_" + rec.pid); } catch(e){}
          if(onDone) onDone(true);
        } else { retry(); }
      })
      .catch(retry);
  };
  const retry = () => {
    if(attempt >= 4){
      const w = document.getElementById("saveWarn");
      if(w) w.style.display = "block";
      if(onDone) onDone(false);
      return;
    }
    setTimeout(tryOnce, attempt * 1500);
  };
  tryOnce();
}

/* If a previous response never reached the sheet, push it again on next load. */
function flushPending(){
  if(!CFG.ENDPOINT) return;
  let keys = [];
  try { for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.indexOf("sa_pending_") === 0) keys.push(k); } } catch(e){ return; }
  keys.forEach(k => {
    const body = localStorage.getItem(k);
    if(!body) return;
    fetch(CFG.ENDPOINT, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body })
      .then(r => r.json()).then(j => { if(j && j.ok){ try{ localStorage.removeItem(k); }catch(e){} } })
      .catch(() => {});
  });
}

/* Marks this browser as having finished, so a second run from the same device is
   stopped at the consent screen. A soft lock: clearing site data defeats it, which is
   why the backend also refuses a duplicate Participant ID. */
const DONE_KEY = "sa_completed";
function markDone(){ try { localStorage.setItem(DONE_KEY, new Date().toISOString()); } catch(e){} }
function alreadyDone(){ try { return !!localStorage.getItem(DONE_KEY); } catch(e){ return false; } }

/* The recruitment message, word for word as it goes out on WhatsApp. The link is read
   off the address bar rather than written down here, so it can never point somewhere
   the form no longer lives. */
function formURL(){ return location.href.split("?")[0].split("#")[0]; }
function shareWA(){
  return "https://wa.me/?text=" + encodeURIComponent(`Hello!

I am Kirti Bhardwaj, an undergraduate Psychology student at MIT-WPU, currently conducting a research study as part of my Undergraduate Dissertation.

If you are *between the age of 22 and 60, currently employed full-time in a private-sector organisation in India, and have been employed in your current organisation for at least 9 months*, I would be very grateful if you could participate in my study by completing the questionnaire below.

The questionnaire will take approximately *10 to 12 minutes* to complete. Your responses are confidential and will be used solely for academic research.

If you meet the above criteria, please fill out the form using the link below:

${formURL()}

Thank you for taking the time to contribute to my research. Your response would be greatly appreciated!`);
}

function paintEnd(msg, debrief, offerReturn){
  if(offerReturn){
    $("#main").innerHTML = `<div class="end"><h2>${esc(msg)}</h2>
      <p class="hint">If you chose an option by mistake, you can go back and change it.</p>
      <p style="margin-top:20px"><button type="button" id="goBack">Go back and change my answer</button></p></div>`;
    document.querySelector(".nav").style.display = "none";
    $("#goBack").addEventListener("click", () => {
      document.querySelector(".nav").style.display = "";
      paint(); restore();
    });
    window.scrollTo(0,0);
    return;
  }
  $("#main").innerHTML = debrief ? `
    <div class="end"><h2>Thank you for participating!</h2>
    <div class="share"><p>Please send it to 5 more people!</p>
    <a id="shareWA" href="#" target="_blank" rel="noopener">Send on WhatsApp</a></div>
    <p>This study examines how employed adults form beliefs about the compensation they could obtain for their current role in the job market, and how such beliefs relate to their evaluations of their present employment.</p>
    <p>The job listing you saw was a hypothetical example constructed for the purposes of this research. It is not a real vacancy, and the compensation range on it was set for the purposes of this study rather than drawn from the market. Please do not treat it as a guide to your own pay.</p>
    <p>Your responses will remain anonymous and confidential.</p>
    <p>If you have any further questions regarding this study, or if you wish to withdraw your response, please write to the researcher from the email address you provided in this questionnaire:</p>
    <p>Researcher: Kirti Bhardwaj, <a href="mailto:kirti.bhardwaj@mitwpu.edu.in">kirti.bhardwaj@mitwpu.edu.in</a></p>
    <p style="margin-top:22px">Thank you once again for your valuable participation and contribution to this research.</p>
    <p id="saveWarn" style="display:none;color:var(--warn);font-weight:600">Your connection dropped while saving. Your answers are stored on this device. Please reopen this link once while online and they will be sent automatically.</p></div>`
    : `<div class="end"><h2>${esc(msg)}</h2></div>`;
  const sw = $("#shareWA"); if(sw) sw.href = shareWA();
  document.querySelector(".nav").style.display = "none";
  $("#prog").style.width = "100%";
  window.scrollTo(0,0);
}

function paint(){
  const sc = SCREENS[step];
  if(sc.id === "listing" && pipesChanged()) invalidateListing();
  $("#main").innerHTML = sc.render();
  restore();
  if(sc.after) sc.after();
  $("#back").style.visibility = step === 0 ? "hidden" : "visible";
  if(sc.id !== "listing") $("#next").textContent = step === SCREENS.length - 1 ? "Submit" : "Continue";
  $("#prog").style.width = Math.round((step / SCREENS.length) * 100) + "%";
  keepTitle = sc.id === "listing";
  window.scrollTo(0,0);
  measureBar(); setBarState();
}

$("#next").addEventListener("click", () => {
  const r = SCREENS[step].validate();
  if(r === "stop" || r === false || r === "async") return;
  if(step === SCREENS.length - 1){
    derive(); markDone();
    /* The thank-you appears at once and the save runs behind it, so nobody waits on
       the network to see that they are finished. A failed save shows the warning. */
    paintEnd("", true);
    sendRecord(buildRecord("Complete", ""));
    return;
  }
  step++; paint();
});
$("#back").addEventListener("click", () => {
  if(SCREENS[step].id === "listing" && S._t0){
    S.listingSeconds = +(S.listingSeconds + (Date.now() - S._t0)/1000).toFixed(1); S._t0 = null;
  }
  if(step > 0){ step--; paint(); }
});

flushPending(); warmBackend(); build();
if(alreadyDone()){
  /* Reopening shows the debrief again rather than a notice, so somebody who closed the
     tab too quickly can still read it and find the contact address. */
  paintEnd("", true);
} else {
  paint();
}
</script>
